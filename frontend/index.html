<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Emitir Licencia</title>
</head>
<body>
<h1>Emitir Licencia</h1>
<form id="formLicencia">
  <input type="text" id="titular" placeholder="Titular" required><br><br>
  <input type="number" id="edad" placeholder="Edad" required><br><br>

  <select id="clase">
    <option value="A">A</option>
    <option value="B">B</option>
    <option value="C">C</option>
    <option value="D">D</option>
    <option value="E">E</option>
    <option value="F">F</option>
    <option value="G">G</option>
  </select><br><br>

  <textarea id="observaciones" placeholder="Observaciones"></textarea><br><br>

  <label>
    <input type="checkbox" id="licenciaB"> Posee licencia B
  </label><br><br>

  <input type="number" id="antiguedad" placeholder="Antigüedad licencia B"><br><br>

  <label>
    <input type="checkbox" id="profesional"> Posee licencia profesional
  </label><br><br>

  <button type="submit">Emitir</button>
</form>

<script>
document.getElementById('formLicencia').addEventListener('submit', async (e) => {
  e.preventDefault();

  const data = {
    titular: document.getElementById('titular').value,
    edad: parseInt(document.getElementById('edad').value),
    clase: document.getElementById('clase').value,
    observaciones: document.getElementById('observaciones').value,
    poseeLicenciaB: document.getElementById('licenciaB').checked,
    antiguedadLicenciaB: parseInt(document.getElementById('antiguedad').value || 0),
    poseeLicenciaProfesional: document.getElementById('profesional').checked
  };

  try {
    const response = await fetch('http://localhost:8080/licencias', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(data)
    });

    if (!response.ok) {
      const error = await response.text();
      throw new Error(error);
    }

    alert('Licencia emitida correctamente');
  } catch (err) {
    alert(err.message);
  }
});
</script>
</body>
</html>
