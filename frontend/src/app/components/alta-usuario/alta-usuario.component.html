<div class="page-container">
  <div class="form-card">
    <h1>Alta de usuario administrativo</h1>
    <p>Complete los datos para registrar un nuevo usuario en el sistema.</p>

    <form (ngSubmit)="darDeAlta()">
      <label for="id">ID de usuario</label>
      <input
        id="id"
        [(ngModel)]="id"
        name="id"
        placeholder="Identificador único"
        autocomplete="off"
      />

      <label for="nombre">Nombre</label>
      <input
        id="nombre"
        [(ngModel)]="nombre"
        name="nombre"
        placeholder="Nombre completo"
        autocomplete="off"
      />

      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Contraseña"
        autocomplete="new-password"
      />

      <div class="button-group">
        <button type="submit" class="primary-button" [disabled]="cargando">
          {{ cargando ? 'Guardando...' : 'Dar de alta' }}
        </button>
        <button type="button" class="secondary-button" (click)="volver()">
          Volver
        </button>
      </div>
    </form>

    <div *ngIf="mensaje" [class]="esError ? 'message error' : 'message success'">
      {{ mensaje }}
    </div>
  </div>
</div>
