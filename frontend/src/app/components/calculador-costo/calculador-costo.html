<main class="shell" style="background-color: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center;">
  <div class="container" style="padding: 30px; max-width: 500px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px auto; border: 1px solid #e0e0e0; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
  
  <h2 style="color: #2c3e50; margin-bottom: 20px; border-bottom: 2px solid #3498db; padding-bottom: 10px; text-align: center;">
    Calcular Costo de Licencia
  </h2>
  
  <div class="form-group" style="margin-bottom: 20px;">
    <label for="clase" style="display: block; margin-bottom: 8px; font-weight: 600; color: #34495e;">
      Clase de Licencia:
    </label>
    <select 
      id="clase" 
      [(ngModel)]="claseSeleccionada" 
      (ngModelChange)="actualizarCosto()"
      style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #cccccc; font-size: 14px; background-color: #00978a;">
      <option value="" disabled selected>Seleccione una clase...</option>
      <option value="A">Clase A (Ciclomotores, motocicletas y triciclos)</option>
      <option value="B">Clase B (Automóviles y camionetas con acoplado)</option>
      <option value="C">Clase C (Camiones sin acoplado)</option>
      <option value="D">Clase D (Transporte de pasajeros, emergencia, seguridad)</option>
      <option value="E">Clase E (Camiones articulados o maquinaria especial)</option>
    </select>
  </div>

  <div class="form-group" style="margin-bottom: 25px;">
    <label for="vigencia" style="display: block; margin-bottom: 8px; font-weight: 600; color: #34495e;">
      Vigencia de la Licencia:
    </label>
    <select 
      id="vigencia" 
      [(ngModel)]="vigenciaSeleccionada" 
      (ngModelChange)="actualizarCosto()"
      style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #cccccc; font-size: 14px; background-color: #00978a;">
      <option [value]="null" disabled selected>Seleccione la vigencia...</option>
      <option [value]="1">1 Año</option>
      <option [value]="3">3 Años</option>
      <option [value]="4">4 Años</option>
      <option [value]="5">5 Años</option>
    </select>
  </div>

  <div class="form-group" style="margin-bottom: 10px; padding: 15px; background-color: #f8f9fa; border-radius: 6px; border-left: 4px solid #2ecc71;">
    <label for="costoTotal" style="display: block; margin-bottom: 6px; font-weight: bold; color: #2c3e50;">
      Costo Total (incluye $8 de gastos administrativos):
    </label>
    <input 
      type="text" 
      id="costoTotal" 
      [value]="costoCalculado !== null ? '$' + costoCalculado : 'Esperando datos...'" 
      readonly
      style="width: 93%; padding: 10px; border: 1px solid #dcdde1; border-radius: 4px; background-color: #eaedd1; font-size: 16px; font-weight: bold; color: #27ae60; text-align: center;" />
  </div>

</div>
</main>
