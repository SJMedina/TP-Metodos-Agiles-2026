<div class="calculador-shell">
  <div class="calculador-card">
    <div class="header-row">
      <div>
        <h2>Calcular Costo de Licencia</h2>
        <p class="helper-text">Use la clase seleccionada en el formulario principal y seleccione la vigencia.</p>
      </div>
    </div>

    <div class="form-group">
      <label for="clase">Clase de Licencia</label>
      <select id="clase" [(ngModel)]="claseSeleccionada" (ngModelChange)="actualizarCosto()">
        <option value="" disabled>Seleccione una clase...</option>
        <option value="A">Clase A (Ciclomotores, motocicletas y triciclos)</option>
        <option value="B">Clase B (Automóviles y camionetas con acoplado)</option>
        <option value="C">Clase C (Camiones sin acoplado)</option>
        <option value="D">Clase D (Transporte de pasajeros, emergencia o seguridad)</option>
        <option value="E">Clase E (Camiones articulados o maquinaria especial)</option>
        <option value="F">Clase F (Automotores adaptados para discapacitados)</option>
        <option value="G">Clase G (Tractores agrícolas y maquinaria especial agrícola)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="vigencia">Vigencia de la Licencia</label>
      <select id="vigencia" [(ngModel)]="vigenciaSeleccionada" (ngModelChange)="actualizarCosto()">
        <option [ngValue]="null" disabled>Seleccione la vigencia...</option>
        <option [ngValue]="1">1 Año</option>
        <option [ngValue]="3">3 Años</option>
        <option [ngValue]="4">4 Años</option>
        <option [ngValue]="5">5 Años</option>
      </select>
    </div>

    <div class="costo-card">
      <label for="costoTotal">Costo Total (incluye $8 de gastos administrativos)</label>
      <input type="text" id="costoTotal" [value]="costoCalculado !== null ? '$' + costoCalculado : 'Esperando datos...'" readonly />
    </div>

    <div *ngIf="mensajeCarga" class="message error">{{ mensajeCarga }}</div>
  </div>
</div>
