<div class="login-page">
  <div class="login-card">
    <div class="badge">Acceso restringido</div>
    <h1>Panel de administración</h1>
    <p>Ingrese sus credenciales de super usuario para gestionar los usuarios administrativos.</p>

    <form (ngSubmit)="iniciarSesion()">
      <label for="id">ID</label>
      <input
        id="id"
        [(ngModel)]="id"
        name="id"
        placeholder="ID de super usuario"
        autocomplete="username"
      />

      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Contraseña"
        autocomplete="current-password"
      />

      <button type="submit" class="primary-button" [disabled]="cargando">
        {{ cargando ? 'Validando...' : 'Ingresar' }}
      </button>
    </form>

    <div *ngIf="mensaje" class="message error">{{ mensaje }}</div>
  </div>
</div>
