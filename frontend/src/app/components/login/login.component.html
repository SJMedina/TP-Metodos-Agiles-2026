<div class="login-page">
  <div class="login-card">
    <h1>Iniciar sesión</h1>
    <p>Ingrese las credenciales para emitir licencias y calcular el costo.</p>

    <form (ngSubmit)="iniciarSesion()">
      <label for="username">Usuario</label>
      <input id="username" [(ngModel)]="username" name="username" placeholder="Usuario" />

      <label for="password">Contraseña</label>
      <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="Contraseña" />

      <button type="submit" class="primary-button" [disabled]="cargando">
        {{ cargando ? 'Validando...' : 'Iniciar sesión' }}
      </button>
    </form>

    <div *ngIf="mensaje" class="message error">{{ mensaje }}</div>

    <div class="credentials-info">
      <p><strong>Credenciales de prueba:</strong></p>
      <p><code>admin / admin123</code></p>
      <p><code>empleado / emp123</code></p>
    </div>
  </div>
</div>
