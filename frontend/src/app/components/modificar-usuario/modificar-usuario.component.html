<div class="page-container">
  <div class="form-card">
    <h1>Modificar usuario administrativo</h1>
    <p>Selecciona un usuario y actualiza sus datos.</p>

    <div *ngIf="cargandoLista" class="loading">Cargando usuarios...</div>

    <div *ngIf="!cargandoLista && (!usuarios || usuarios.length === 0)" class="empty-message">
      No hay usuarios para modificar
    </div>

    <div *ngIf="!cargandoLista && usuarios && usuarios.length > 0" class="usuarios-list">
      <h3>Usuarios disponibles</h3>
      <div class="usuarios-grid">
        <button
          *ngFor="let usuario of usuarios"
          type="button"
          class="usuario-item"
          [class.selected]="usuarioSeleccionado?.id === usuario.id"
          (click)="seleccionarUsuario(usuario)"
        >
          <div class="usuario-id">{{ usuario.id }}</div>
          <div class="usuario-nombre">{{ usuario.nombre }}</div>
        </button>
      </div>
    </div>

    <form *ngIf="usuarioSeleccionado" (ngSubmit)="actualizar()" class="form-section">
      <h3>Editando: {{ usuarioSeleccionado.nombre }}</h3>

      <label for="nombre">Nombre (opcional)</label>
      <input
        id="nombre"
        [(ngModel)]="nombre"
        name="nombre"
        placeholder="Dejar en blanco para no cambiar"
        autocomplete="off"
      />

      <label for="password">Contraseña (opcional)</label>
      <input
        id="password"
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Dejar en blanco para no cambiar"
        autocomplete="new-password"
      />

      <div class="button-group">
        <button type="submit" class="primary-button" [disabled]="cargando">
          {{ cargando ? 'Guardando...' : 'Actualizar' }}
        </button>
        <button type="button" class="secondary-button" (click)="cancelar()">
          Cancelar
        </button>
      </div>
    </form>

    <div *ngIf="mensaje" [class]="esError ? 'message error' : 'message success'">
      {{ mensaje }}
    </div>

    <div class="button-group" style="margin-top: 2rem">
      <button type="button" class="secondary-button" (click)="volver()">
        Volver
      </button>
    </div>
  </div>
</div>
