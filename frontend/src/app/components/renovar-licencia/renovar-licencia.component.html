<div class="page">
  <div class="header-row">
    <div>
      <h1>Renovar Licencia</h1>
      <p>Seleccione el motivo de la renovación.</p>
    </div>
    <button class="secondary-button" routerLink="/listar-licencias">Volver al listado</button>
  </div>

  <div class="form-card" style="display: flex; gap: 1.5rem; justify-content: center;">
    <button class="primary-button" style="flex:1; padding: 2rem; font-size: 1.1rem;" (click)="irAVencimiento()">
      🗓️ Renovar por vencimiento
      <p style="font-size: 0.85rem; font-weight: normal; margin-top: 0.5rem;">
        La licencia está próxima a vencer (entre 1 y 6 meses antes)
      </p>
    </button>
    <button class="secondary-button" style="flex:1; padding: 2rem; font-size: 1.1rem;" (click)="irAModificacion()">
      ✏️ Renovar por modificación de datos
      <p style="font-size: 0.85rem; font-weight: normal; margin-top: 0.5rem;">
        Se necesita actualizar algún dato de la licencia
      </p>
    </button>
  </div>
</div>
